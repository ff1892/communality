name: Keepalive Ping

on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping target URL
        env:
          TARGET_URL: ${{ secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "KEEPALIVE_URL secret is missing" >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --max-time 20 \
            --retry 2 --retry-delay 5 \
            -H 'User-Agent: gh-actions-keepalive/1.0' \
            "$TARGET_URL" \
            --write-out '\nHTTP %{http_code}\n'
